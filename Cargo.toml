[package]
name = "gbc"
version = "0.1.1"
edition = "2024"
description = "A Game Boy, Game Boy Color and Super Game Boy emulator."
license = "MIT OR Apache-2.0"
repository = "https://github.com/axle-h/gbc"
readme = "README.md"
keywords = ["gameboy", "emulator", "game-boy-color", "gbc", "sgb"]
categories = ["emulators"]
# The test ROMs serve only the crate's own tests, and not every one carries a licence to pass on.
exclude = ["src/roms/", "docs/", ".github/", "CLAUDE.md", "CONTRIBUTING.md"]

[features]
# The throughput benches, which run for tens of seconds each.
slow-tests = []

[dependencies]
bincode = "2.0.1"
bitflags = "2.9.3"
image = "0.25"
lz4_flex = "0.14"
paste = "1.0"
png = "0.18"
# A joypad tape, and the buttons in it, can be written as JSON.
serde = { version = "1.0", features = ["derive"] }
strum = "0.27"
strum_macros = "0.27.2"

[dev-dependencies]
serde_json = "1.0"

# The tests are bound by raw emulation speed; these two make every test faster at once.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 3
