# Publishes `gbc` to crates.io when a `gbc-v<version>` tag is pushed. No API token is stored: crates.io's
# Trusted Publishing trades this job's OIDC token for a short-lived one, and it only accepts this file
# name from this repository, so renaming the file means updating the crate's settings on crates.io.
name: publish-gbc

on:
  push:
    tags: ['gbc-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io

    steps:
      # No submodule: `gbc` needs nothing outside its own directory.
      - name: Check out
        uses: actions/checkout@v7

      - name: Rust
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable

      - name: The tag names the version in gbc/Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p gbc)"
          version="${version##*[#@]}"
          if [ "$TAG" != "gbc-v$version" ]; then
            echo "::error::tag $TAG does not match gbc $version"
            exit 1
          fi

      - name: Test gbc
        run: cargo test --release --locked -p gbc

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked -p gbc
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
